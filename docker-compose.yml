services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenhouse_user
      POSTGRES_PASSWORD: greenhouse_pass
      POSTGRES_DB: greenhouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse_user -d greenhouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: